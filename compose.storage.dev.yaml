# Development-only: docker compose -f compose.yaml -f compose.storage.dev.yaml up -d --build
# For Bun running on host: docker compose -f compose.yaml -f compose.storage.dev.yaml up -d db storage
services:
  storage:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: lifeboard-dev
      AWS_SECRET_ACCESS_KEY: lifeboard-local-secret
      S3_BUCKET: lifeboard-dev
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  migrate:
    environment:
      NODE_ENV: development

  api:
    environment:
      NODE_ENV: development
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ru-central1
      S3_BUCKET: lifeboard-dev
      S3_ACCESS_KEY_ID: lifeboard-dev
      S3_SECRET_ACCESS_KEY: lifeboard-local-secret
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      storage:
        condition: service_started

volumes:
  seaweedfs_data:
