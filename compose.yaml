x-app-env: &app-env
  NODE_ENV: production
  PORT: '3000'
  DB_HOST: db
  DB_PORT: '5432'
  DB_USER: ${DB_USER:?Set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_SSL: 'false'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_EXPOSE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    environment: *app-env
    command:
      - node
      - ./node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    environment: *app-env
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
